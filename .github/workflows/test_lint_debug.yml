name: DEBUG - UT & Lint pipeline

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  run_tests:
    name: Testing debug variant
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: Set up secret variables
        run: echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > local.properties
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Execute Gradle command - testDebugUnitTest
        run: ./gradlew testDebugUnitTest

      - name: Execute Gradle command - lintDebug
        run: ./gradlew lintDebug

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/testDebugUnitTest/
            **/build/reports/tests/testDebugUnitTest/

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/lint-results-debug.xml

  debug-apk:
    name: Generate Debug APK
    runs-on: ubuntu-latest
    needs: run_tests
    if: success()
    
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up secret variables
        run: echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > local.properties

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
