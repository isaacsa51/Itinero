name: On Pull Request Opened on MASTER

on:
  pull_request:
    branches: [ master ]

jobs:
  run_tests:
    name: Testing RELEASE variant
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up secret variables
        run: echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > local.properties

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Execute Gradle command - testReleaseUnitTest
        run: ./gradlew testReleaseUnitTest

      - name: Execute Gradle command - lintRelease
        run: ./gradlew lintRelease
